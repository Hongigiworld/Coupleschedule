<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Couple Schedule</title>
  <meta name="theme-color" content="#ff8fb3" />
  <style>
    :root{
      --pink:#ff8fb3;--hot:#ff5d91;--light:#fff1f6;--ink:#2b2430;--muted:#8a7f8d;
      --card:rgba(255,255,255,.88);--line:rgba(255,141,179,.25);
      --shadow:0 18px 48px rgba(255,93,145,.18);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#fff5f8,#ffeef5 45%,#fff9ef);color:var(--ink)}
    .app{max-width:520px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom))}
    header{padding:22px 2px 12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
    .kicker{display:inline-flex;background:#fff;color:var(--hot);border:1px solid var(--line);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:900}
    h1{margin:9px 0 0;font-size:30px;letter-spacing:-.04em;line-height:1.05}
    .chars{display:flex;gap:6px}.char{width:44px;height:44px;border-radius:999px;background:#fff;object-fit:cover;border:2px solid #fff;box-shadow:0 10px 24px rgba(255,93,145,.22)}
    .notice,.card{background:var(--card);border:1px solid rgba(255,255,255,.88);border-radius:26px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
    .notice{color:var(--muted);font-size:13px;line-height:1.45}
    .online{color:#16a34a;font-weight:900}.offline{color:#dc2626;font-weight:900}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.stat{background:#fff;border-radius:22px;padding:14px 12px}.stat span{display:block;color:var(--muted);font-size:12px;font-weight:800}.stat strong{display:block;margin-top:5px;font-size:24px}
    .tabs{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(255,255,255,.72);border-radius:24px;padding:6px;margin:12px 0;backdrop-filter:blur(16px)}
    .tab{border:0;background:transparent;border-radius:18px;padding:10px 6px;color:var(--muted);font-weight:900;font-size:13px}.tab.active{background:var(--ink);color:#fff}
    h2{margin:0 0 13px;font-size:18px;letter-spacing:-.03em}
    input,textarea,select{width:100%;border:1px solid var(--line);border-radius:18px;padding:13px 14px;background:#fff;font-size:15px;outline:none;color:var(--ink);margin-bottom:9px}
    textarea{min-height:78px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    button{font-family:inherit}.button{width:100%;border:0;border-radius:20px;padding:15px 16px;background:var(--ink);color:#fff;font-weight:900;font-size:15px}.button.pink{background:var(--hot)}
    .filters{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px}.chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:9px 13px;font-weight:900;white-space:nowrap}.chip.active{background:var(--hot);color:#fff;border-color:var(--hot)}
    .hero{background:#25202c;color:#fff;border-radius:30px;padding:18px;margin-bottom:12px;box-shadow:0 18px 44px rgba(43,36,48,.22)}.hero small{color:#ffc9dc;font-weight:900}.hero-row{display:flex;justify-content:space-between;gap:12px;margin-top:11px;align-items:center}.hero h3{margin:0 0 4px}.pill{background:rgba(255,255,255,.14);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}
    .event,.shopping-item,.notice-item{background:#fff;border:1px solid var(--line);border-radius:24px;padding:14px;margin-bottom:10px}.event.done{opacity:.56}.event-top{display:flex;align-items:flex-start;gap:11px}.check{width:28px;height:28px;border-radius:999px;border:2px solid #ffd0df;background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent;font-weight:900}.check.on{background:var(--hot);color:#fff;border-color:var(--hot)}
    .event-main{flex:1;min-width:0}.event h3{margin:0;font-size:17px}.event.done h3{text-decoration:line-through;color:var(--muted)}.meta{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.45}.memo{margin-top:9px;background:#fff7ed;color:#6b5e66;padding:10px;border-radius:16px;font-size:13px}.tagline{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}.tag{background:var(--light);color:var(--hot);padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.delete{border:0;background:transparent;color:var(--hot);font-weight:900}
    .shopping-item{display:flex;align-items:center;gap:10px}.shopping-item span.done{text-decoration:line-through;color:var(--muted)}.notice-item.unread{background:#fff0f6}.notice-item b{display:block;margin-bottom:5px}.notice-item p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
    .empty{color:var(--muted);text-align:center;padding:25px 0}.hide{display:none}.small{font-size:12px;color:var(--muted);line-height:1.45}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="kicker">💕 우리 둘 일정장</div>
      <h1>Couple<br>Schedule</h1>
    </div>
    <div class="chars">
      <img class="char" src="assets/hello-kitty.png" onerror="this.style.display='none'">
      <img class="char" src="assets/cinnamoroll.png" onerror="this.style.display='none'">
      <img class="char" src="assets/pompompurin.png" onerror="this.style.display='none'">
    </div>
  </header>

  <div class="notice">
    상태: <span id="syncStatus" class="offline">Firebase 설정 필요</span><br>
    이 버전은 Firestore 실시간 동기화 구조입니다. 같은 <b>커플 코드</b>를 쓰면 너와 와이프 화면이 같이 업데이트됩니다.
  </div>

  <section class="summary">
    <div class="stat"><span>전체</span><strong id="statAll">0</strong></div>
    <div class="stat"><span>오늘</span><strong id="statToday">0</strong></div>
    <div class="stat"><span>장보기</span><strong id="statShop">0</strong></div>
  </section>

  <nav class="tabs">
    <button class="tab active" data-tab="schedule">일정</button>
    <button class="tab" data-tab="shopping">장보기</button>
    <button class="tab" data-tab="notify">알림</button>
    <button class="tab" data-tab="settings">설정</button>
  </nav>

  <main id="schedule" class="page">
    <section id="upcoming" class="hero hide"></section>

    <section class="card">
      <h2>일정 추가</h2>
      <input id="title" placeholder="일정 제목">
      <div class="row"><input id="date" type="date"><input id="time" type="time"></div>
      <div class="row">
        <select id="owner"><option value="both">둘 다</option><option value="me">나</option><option value="wife">와이프</option></select>
        <select id="category"><option value="home">집안일</option><option value="date">데이트</option><option value="family">가족</option><option value="money">돈/납부</option><option value="trip">여행</option><option value="anniversary">기념일</option><option value="health">병원/건강</option><option value="etc">기타</option></select>
      </div>
      <div class="row">
        <select id="reminder"><option value="0">정시</option><option value="10">10분 전</option><option value="30" selected>30분 전</option><option value="60">1시간 전</option><option value="1440">하루 전</option></select>
        <select id="repeat"><option value="none">반복 없음</option><option value="daily">매일</option><option value="weekly">매주</option><option value="monthly">매월</option><option value="yearly">매년</option></select>
      </div>
      <input id="location" placeholder="장소">
      <textarea id="memo" placeholder="메모"></textarea>
      <button class="button" id="addEvent">일정 저장</button>
    </section>

    <div class="filters">
      <button class="chip active" data-filter="all">전체</button>
      <button class="chip" data-filter="today">오늘</button>
      <button class="chip" data-filter="me">나</button>
      <button class="chip" data-filter="wife">와이프</button>
      <button class="chip" data-filter="anniversary">기념일</button>
    </div>
    <section id="eventList"></section>
  </main>

  <main id="shopping" class="page hide">
    <section class="card">
      <h2>공동 쇼핑리스트</h2>
      <input id="shoppingText" placeholder="살 것 입력">
      <button class="button pink" id="addShopping">추가</button>
    </section>
    <section id="shoppingList"></section>
  </main>

  <main id="notify" class="page hide">
    <section class="card">
      <h2>알림센터</h2>
      <button class="button" id="allowNoti">브라우저 알림 켜기</button>
    </section>
    <section id="noticeList"></section>
  </main>

  <main id="settings" class="page hide">
    <section class="card">
      <h2>커플 연결</h2>
      <input id="coupleCodeInput" value="HONG-LOVE-2026">
      <button class="button pink" id="saveCoupleCode">커플 코드 저장</button>
      <p class="small">너와 와이프가 같은 커플 코드를 쓰면 같은 Firestore 문서를 보게 됩니다.</p>
    </section>
    <section class="card">
      <h2>Firebase 설정 필요</h2>
      <p class="small">아래 코드 상단의 <b>firebaseConfig</b>를 네 Firebase 웹앱 설정값으로 교체해야 실시간 공유가 켜집니다.</p>
    </section>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import {
    getFirestore, doc, onSnapshot, setDoc, updateDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  /*
    여기를 Firebase 콘솔에서 받은 값으로 교체해야 함.
    Firebase Console → Project settings → Your apps → Web app → firebaseConfig
  */
  const firebaseConfig = {
  apiKey: "AIzaSyCIOZLzZODYmGIwSspvwShe7IEUJFVjoYw",
  authDomain: "couple-schedule-cb678.firebaseapp.com",
  projectId: "couple-schedule-cb678",
  storageBucket: "couple-schedule-cb678.firebasestorage.app",
  messagingSenderId: "82450439618",
  appId: "1:82450439618:web:a6cbcb5bd81230cf9b4a5b",
  measurementId: "G-47LJX0V94N"
};

  const LOCAL_BACKUP_KEY = "couple-schedule-firebase-backup-v1";
  const COUPLE_CODE_KEY = "couple-code-v1";
  const today = () => new Date().toISOString().slice(0, 10);
  const uid = () => String(Date.now()) + Math.random().toString(16).slice(2);

  const labels = {
    owner: { both: "둘 다", me: "나", wife: "와이프" },
    category: { home: "집안일", date: "데이트", family: "가족", money: "돈/납부", trip: "여행", anniversary: "기념일", health: "병원/건강", etc: "기타" },
    repeat: { none: "반복 없음", daily: "매일", weekly: "매주", monthly: "매월", yearly: "매년" }
  };

  let coupleCode = localStorage.getItem(COUPLE_CODE_KEY) || "HONG-LOVE-2026";
  let db = null;
  let coupleRef = null;
  let activeFilter = "all";
  let state = loadBackup();
  let unsubscribe = null;

  document.getElementById("date").value = today();
  document.getElementById("time").value = "09:00";
  document.getElementById("coupleCodeInput").value = coupleCode;

  function defaultState(){
    return {
      events: [{
        id: uid(), title: "장보기", date: today(), time: "19:30", owner: "both", category: "home",
        reminder: "30", repeat: "none", location: "집 근처 마트", memo: "우유, 물, 고양이 간식", done: false, createdAt: new Date().toISOString()
      }],
      shopping: [{ id: uid(), text: "물티슈", done: false }, { id: uid(), text: "샴푸", done: false }],
      notices: []
    };
  }

  function loadBackup(){
    try { return JSON.parse(localStorage.getItem(LOCAL_BACKUP_KEY)) || defaultState(); }
    catch { return defaultState(); }
  }

  function backup(){
    localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(state));
  }

  function firebaseReady(){
    return firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("PASTE_");
  }

  async function initFirebase(){
    if(!firebaseReady()){
      setStatus("Firebase 설정 필요", false);
      render();
      return;
    }

    try{
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      subscribeCouple(coupleCode);
    }catch(err){
      console.error(err);
      setStatus("Firebase 연결 실패", false);
      render();
    }
  }

  function subscribeCouple(code){
    if(unsubscribe) unsubscribe();

    coupleRef = doc(db, "couples", code);
    setStatus("연결 중...", false);

    unsubscribe = onSnapshot(coupleRef, async (snap) => {
      if(!snap.exists()){
        await setDoc(coupleRef, { ...state, coupleCode: code, updatedAt: serverTimestamp() });
        setStatus("실시간 공유 연결됨", true);
        return;
      }

      const data = snap.data();
      state = {
        events: data.events || [],
        shopping: data.shopping || [],
        notices: data.notices || []
      };
      backup();
      setStatus("실시간 공유 연결됨", true);
      render();
    }, (err) => {
      console.error(err);
      setStatus("권한/연결 오류", false);
      render();
    });
  }

  async function sync(){
    backup();
    render();

    if(!coupleRef) return;
    await setDoc(coupleRef, { ...state, coupleCode, updatedAt: serverTimestamp() }, { merge: true });
  }

  function setStatus(text, ok){
    const el = document.getElementById("syncStatus");
    el.textContent = text;
    el.className = ok ? "online" : "offline";
  }

  function eventDateTime(e){ return new Date(`${e.date}T${e.time || "00:00"}:00`); }
  function formatDate(date){ return new Date(`${date}T00:00:00`).toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"short"}); }
  function minutesUntil(e){ return Math.round((eventDateTime(e) - new Date()) / 60000); }
  function escapeHtml(str=""){ return String(str).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c])); }

  function addNotice(title, body){
    state.notices.unshift({ id: uid(), title, body, read: false, createdAt: new Date().toISOString() });
  }

  function render(){
    renderStats();
    renderUpcoming();
    renderEvents();
    renderShopping();
    renderNotices();
  }

  function renderStats(){
    document.getElementById("statAll").textContent = state.events.length;
    document.getElementById("statToday").textContent = state.events.filter(e => e.date === today()).length;
    document.getElementById("statShop").textContent = state.shopping.filter(i => !i.done).length;
  }

  function renderUpcoming(){
    const box = document.getElementById("upcoming");
    const upcoming = state.events.filter(e => !e.done && eventDateTime(e) >= new Date()).sort((a,b) => eventDateTime(a)-eventDateTime(b)).slice(0,2);
    if(!upcoming.length){ box.classList.add("hide"); return; }
    box.classList.remove("hide");
    box.innerHTML = `<small>다가오는 일정</small>${upcoming.map(e => `<div class="hero-row"><div><h3>${escapeHtml(e.title)}</h3><div style="color:#d9d1dc;font-size:13px;">${formatDate(e.date)} · ${e.time}</div></div><div class="pill">${minutesUntil(e)}분</div></div>`).join("")}`;
  }

  function renderEvents(){
    const list = document.getElementById("eventList");
    let events = [...state.events].filter(e => {
      if(activeFilter === "all") return true;
      if(activeFilter === "today") return e.date === today();
      if(activeFilter === "anniversary") return e.category === "anniversary";
      return e.owner === activeFilter || e.owner === "both";
    }).sort((a,b) => eventDateTime(a)-eventDateTime(b));

    if(!events.length){ list.innerHTML = '<div class="empty">표시할 일정이 없어요.</div>'; return; }

    list.innerHTML = events.map(e => `
      <article class="event ${e.done ? "done" : ""}">
        <div class="event-top">
          <button class="check ${e.done ? "on" : ""}" onclick="toggleEvent('${e.id}')">✓</button>
          <div class="event-main">
            <h3>${escapeHtml(e.title)}</h3>
            <div class="meta">${formatDate(e.date)} · ${e.time} · ${labels.owner[e.owner]}</div>
            <div class="tagline"><span class="tag">${labels.category[e.category]}</span><span class="tag">${labels.repeat[e.repeat]}</span><span class="tag">${e.reminder}분 전</span></div>
            ${e.location ? `<div class="memo">📍 ${escapeHtml(e.location)}</div>` : ""}
            ${e.memo ? `<div class="memo">${escapeHtml(e.memo)}</div>` : ""}
          </div>
          <button class="delete" onclick="deleteEvent('${e.id}')">삭제</button>
        </div>
      </article>
    `).join("");
  }

  function renderShopping(){
    const list = document.getElementById("shoppingList");
    if(!state.shopping.length){ list.innerHTML = '<div class="empty">쇼핑리스트가 비어 있어요.</div>'; return; }
    list.innerHTML = state.shopping.map(i => `
      <div class="shopping-item">
        <button class="check ${i.done ? "on" : ""}" onclick="toggleShopping('${i.id}')">✓</button>
        <span class="${i.done ? "done" : ""}" style="flex:1;font-weight:800;">${escapeHtml(i.text)}</span>
        <button class="delete" onclick="deleteShopping('${i.id}')">삭제</button>
      </div>
    `).join("");
  }

  function renderNotices(){
    const list = document.getElementById("noticeList");
    if(!state.notices.length){ list.innerHTML = '<div class="empty">아직 알림이 없어요.</div>'; return; }
    list.innerHTML = state.notices.map(n => `
      <div class="notice-item ${n.read ? "" : "unread"}">
        <b>${escapeHtml(n.title)}</b>
        <p>${escapeHtml(n.body)}</p>
        <p style="font-size:12px;margin-top:6px;">${new Date(n.createdAt).toLocaleString("ko-KR")}</p>
      </div>
    `).join("");
  }

  window.toggleEvent = async id => {
    state.events = state.events.map(e => e.id === id ? {...e, done: !e.done} : e);
    await sync();
  };
  window.deleteEvent = async id => {
    state.events = state.events.filter(e => e.id !== id);
    addNotice("일정 삭제", "일정이 삭제됐어요.");
    await sync();
  };
  window.toggleShopping = async id => {
    state.shopping = state.shopping.map(i => i.id === id ? {...i, done: !i.done} : i);
    await sync();
  };
  window.deleteShopping = async id => {
    state.shopping = state.shopping.filter(i => i.id !== id);
    await sync();
  };

  document.getElementById("addEvent").onclick = async () => {
    const title = document.getElementById("title").value.trim();
    if(!title) return alert("일정 제목을 입력해줘.");

    const event = {
      id: uid(), title,
      date: document.getElementById("date").value || today(),
      time: document.getElementById("time").value || "09:00",
      owner: document.getElementById("owner").value,
      category: document.getElementById("category").value,
      reminder: document.getElementById("reminder").value,
      repeat: document.getElementById("repeat").value,
      location: document.getElementById("location").value.trim(),
      memo: document.getElementById("memo").value.trim(),
      done: false,
      createdAt: new Date().toISOString()
    };

    state.events.unshift(event);
    addNotice("새 일정 등록", `${labels.owner[event.owner]} 일정 '${event.title}'이 추가됐어요.`);
    ["title","location","memo"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("date").value = today();
    document.getElementById("time").value = "09:00";
    await sync();
  };

  document.getElementById("addShopping").onclick = async () => {
    const text = document.getElementById("shoppingText").value.trim();
    if(!text) return;
    state.shopping.unshift({ id: uid(), text, done: false });
    addNotice("쇼핑리스트 추가", `${text} 항목이 추가됐어요.`);
    document.getElementById("shoppingText").value = "";
    await sync();
  };

  document.getElementById("saveCoupleCode").onclick = () => {
    coupleCode = document.getElementById("coupleCodeInput").value.trim() || "HONG-LOVE-2026";
    localStorage.setItem(COUPLE_CODE_KEY, coupleCode);
    if(db) subscribeCouple(coupleCode);
    alert("커플 코드 저장 완료");
  };

  document.getElementById("allowNoti").onclick = async () => {
    if(!("Notification" in window)) return alert("이 브라우저는 알림을 지원하지 않아요.");
    const result = await Notification.requestPermission();
    alert(result === "granted" ? "알림이 켜졌어요." : "알림 권한이 꺼져 있어요.");
  };

  document.querySelectorAll(".tab").forEach(btn => btn.onclick = () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".page").forEach(p => p.classList.add("hide"));
    document.getElementById(btn.dataset.tab).classList.remove("hide");
  });

  document.querySelectorAll(".chip").forEach(btn => btn.onclick = () => {
    document.querySelectorAll(".chip").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    renderEvents();
  });

  const notified = new Set();
  setInterval(() => {
    if(!("Notification" in window) || Notification.permission !== "granted") return;
    state.events.forEach(e => {
      if(e.done) return;
      const left = minutesUntil(e);
      const key = `${e.id}-${e.date}-${e.time}`;
      if(left >= 0 && left <= Number(e.reminder) && !notified.has(key)){
        notified.add(key);
        new Notification(`곧 일정: ${e.title}`, { body: `${formatDate(e.date)} ${e.time} · ${labels.owner[e.owner]}` });
        addNotice("일정 알림", `${e.title} 일정이 가까워졌어요.`);
        sync();
      }
    });
  }, 15000);

  render();
  initFirebase();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Weekly Meal Plan - Homekeeper</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap');

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#171A3C;
  --ink2:#34385F;
  --muted:#8D90AD;
  --muted2:#B9BBD0;
  --lav:#7354D6;
  --lav2:#9D80F6;
  --lav3:#EFEAFF;
  --lav4:#F8F5FF;
  --pink:#F7DCEB;
  --green:#76BF81;
  --orange:#FF986A;
  --red:#F06B78;
  --paper:rgba(255,255,255,.78);
  --white:#fff;
  --line:rgba(105,84,170,.13);
  --shadow:0 18px 45px rgba(68,55,130,.12);
  --shadow2:0 12px 28px rgba(70,53,140,.12);
  --radius:28px;
}
html,body{min-height:100%;background:radial-gradient(circle at 20% 0%,#F4EEFF 0%,#FAF8FF 42%,#F4F0FB 100%);color:var(--ink);font-family:'DM Sans','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif}
body{display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100vh;background:linear-gradient(180deg,#FEFCFF 0%,#F7F3FF 100%);position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.65)}
.screen{min-height:100vh;padding-bottom:102px;overflow-y:auto;position:relative;z-index:2}
button,input,select,textarea{font:inherit}button{border:0;background:none;cursor:pointer;color:inherit}.hide{display:none!important}

/* Background ornaments */
.bg-blob{position:absolute;border-radius:999px;filter:blur(24px);opacity:.45;pointer-events:none;z-index:0}.blob1{width:190px;height:190px;background:#DED3FF;right:-75px;top:-45px}.blob2{width:150px;height:150px;background:#FFE2ED;left:-65px;top:230px}.blob3{width:180px;height:180px;background:#EAF0FF;right:-75px;bottom:150px}

/* Typography */
.serif{font-family:'Playfair Display',serif;letter-spacing:-.03em}.brand-mini{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--lav);font-weight:800}.h1{font-family:'Playfair Display',serif;font-size:44px;line-height:.98;font-weight:800;letter-spacing:-.035em;color:var(--ink)}.h2{font-size:27px;line-height:1.25;font-weight:800;letter-spacing:-.04em;color:var(--ink)}.h3{font-size:20px;font-weight:800;letter-spacing:-.03em}.sub{font-size:14px;line-height:1.65;color:var(--muted);font-weight:500}.caption{font-size:12px;color:var(--muted);font-weight:600}.section-title{font-size:18px;font-weight:800;letter-spacing:-.035em;margin:22px 0 12px;color:var(--ink)}

/* Shell */
.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:14px 22px 0}.status{font-size:13px;font-weight:800;color:#11132E}.signal{display:flex;gap:4px;align-items:center}.signal span{display:block;background:#14172E;border-radius:3px}.signal span:nth-child(1){width:4px;height:6px}.signal span:nth-child(2){width:4px;height:9px}.signal span:nth-child(3){width:4px;height:12px}.pill-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.72);box-shadow:0 8px 22px rgba(72,61,130,.12),inset 0 0 0 1px rgba(255,255,255,.72);backdrop-filter:blur(18px)}.back{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.75);box-shadow:0 8px 22px rgba(72,61,130,.12);font-size:22px;color:var(--ink)}
.pad{padding:0 24px}.page-head{padding:12px 24px 8px;display:flex;align-items:center;justify-content:space-between}.page-title{font-size:22px;font-weight:900;letter-spacing:-.045em}.soft-card{background:var(--paper);border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow);backdrop-filter:blur(22px);border-radius:var(--radius)}.glass{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.72);box-shadow:var(--shadow2);backdrop-filter:blur(22px)}

/* Food visuals */
.food-hero{position:absolute;right:-42px;bottom:28px;width:285px;height:285px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 28px 65px rgba(59,41,92,.22);border:10px solid rgba(255,255,255,.82);overflow:hidden}.food-hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 36% 28%,rgba(255,255,255,.18),transparent 42%)}.food-round{width:86px;height:86px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 14px 26px rgba(56,45,105,.15);border:6px solid rgba(255,255,255,.8);flex-shrink:0}.food-sm{width:54px;height:54px;border-radius:50%;background-size:cover;background-position:center;border:4px solid #fff;box-shadow:0 8px 16px rgba(52,44,94,.13);flex-shrink:0}.food-mini{width:42px;height:42px;border-radius:14px;background-size:cover;background-position:center;box-shadow:0 6px 14px rgba(52,44,94,.12);flex-shrink:0}.leaf{position:absolute;border-radius:80% 0 80% 0;background:linear-gradient(135deg,#A7D27F,#4FA066);opacity:.8;transform:rotate(24deg);filter:drop-shadow(0 10px 10px rgba(82,120,71,.12));pointer-events:none}.leaf.l1{width:22px;height:46px;right:62px;top:147px}.leaf.l2{width:16px;height:34px;left:36px;bottom:150px;transform:rotate(-26deg)}.dot{position:absolute;border-radius:50%;background:#F5CF72;box-shadow:0 8px 18px rgba(206,160,63,.24)}.dot.d1{width:12px;height:12px;right:78px;top:240px}.dot.d2{width:8px;height:8px;left:58px;bottom:210px;background:#F4B0C8}

/* Buttons */
.cta{width:100%;height:60px;border-radius:26px;background:linear-gradient(135deg,#AE8BFF 0%,#7151D3 100%);color:#fff;font-size:15px;font-weight:800;box-shadow:0 18px 28px rgba(105,78,214,.28);display:flex;align-items:center;justify-content:center;gap:10px;transition:.18s}.cta:active{transform:scale(.985)}.cta:disabled{opacity:.45;box-shadow:none}.secondary{height:50px;border-radius:20px;background:rgba(255,255,255,.68);box-shadow:inset 0 0 0 1px rgba(105,84,170,.12);font-size:13px;font-weight:800;color:var(--lav);padding:0 16px}.ghost-link{font-size:13px;font-weight:800;color:var(--lav);display:flex;align-items:center;justify-content:center;gap:8px}

/* Inputs */
.input-wrap{height:58px;border-radius:20px;background:rgba(255,255,255,.78);box-shadow:inset 0 0 0 1px rgba(105,84,170,.14),0 12px 25px rgba(59,45,111,.06);display:flex;align-items:center;padding:0 16px;gap:10px}.input-wrap input,.input-wrap select{border:0;outline:0;background:transparent;flex:1;color:var(--ink);font-weight:700;font-size:14px;min-width:0}.input-wrap input::placeholder{color:#C0BED2}.form-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:10px}.field-label{font-size:12px;font-weight:800;color:var(--muted);margin:14px 0 7px}

/* Onboarding */
.splash-screen{min-height:100vh;padding:64px 28px 34px;position:relative;overflow:hidden}.logo-line{display:flex;align-items:center;gap:10px;margin-bottom:26px}.logo-mark{width:34px;height:34px;border-radius:14px;background:rgba(255,255,255,.66);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(80,66,150,.16)}.logo-mark svg{width:22px;height:22px;stroke:var(--lav)}.hero-copy{position:relative;z-index:3}.hero-copy .sub{margin-top:22px;width:240px}.splash-cta{position:absolute;left:28px;right:28px;bottom:54px;z-index:4}.api-screen{min-height:100vh;padding:24px 28px 34px;position:relative;overflow:hidden}.api-hero{height:260px;position:relative;margin-bottom:12px}.api-hero .plate{position:absolute;left:50%;top:34px;transform:translateX(-50%);width:205px;height:205px;border-radius:50%;background-size:cover;background-position:center;border:10px solid rgba(255,255,255,.86);box-shadow:0 26px 55px rgba(77,63,137,.18)}.api-card{padding:26px 0 0;position:relative;z-index:5}.api-card .h2{margin:8px 0 10px}.secure-note{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font-size:12px;font-weight:700}.skip{position:absolute;right:28px;top:80px;color:var(--lav);font-weight:800;font-size:13px;z-index:4}

/* Home */
.home-head{padding:14px 24px 0;position:relative}.greet{margin-top:12px}.greet .sub{font-size:12px;color:var(--lav);font-weight:800;margin:0 0 8px}.quick-card{margin:20px 24px 0;padding:16px;border-radius:26px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick-btn{height:78px;border-radius:22px;background:rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:800;color:var(--ink2);box-shadow:inset 0 0 0 1px rgba(114,89,190,.07)}.quick-btn svg{width:23px;height:23px;stroke:var(--lav);stroke-width:2.1}.week-strip{display:flex;gap:10px;overflow:auto;padding:0 24px 4px;scrollbar-width:none}.week-strip::-webkit-scrollbar{display:none}.day-pill{min-width:48px;height:64px;border-radius:21px;background:rgba(255,255,255,.68);box-shadow:0 8px 22px rgba(56,45,105,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink2);font-size:11px;font-weight:800}.day-pill.active{background:linear-gradient(135deg,#A98AFF,#7252D4);color:#fff;box-shadow:0 14px 28px rgba(103,78,210,.28)}.meal-list{padding:2px 24px 24px}.meal-row{height:112px;padding:14px;border-radius:25px;margin-bottom:12px;display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.76);box-shadow:0 14px 32px rgba(62,51,116,.1);border:1px solid rgba(255,255,255,.72)}.meal-info{flex:1;min-width:0}.meal-type{font-size:12px;font-weight:900;margin-bottom:5px}.meal-name{font-size:16px;font-weight:900;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meal-meta{font-size:12px;color:var(--muted);font-weight:700;margin-top:7px}.arrow{color:#A7A7C2;font-size:24px;line-height:1}

/* Fridge */
.stat-card{margin:10px 24px 18px;border-radius:28px;padding:18px;display:flex;align-items:center;justify-content:space-between}.stat-num{font-size:28px;font-weight:900;letter-spacing:-.04em}.tabs{display:flex;gap:8px;overflow:auto;padding:0 24px 12px;scrollbar-width:none}.filter-chip{height:34px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.72);color:var(--muted);font-size:12px;font-weight:900;box-shadow:inset 0 0 0 1px rgba(105,84,170,.08);white-space:nowrap}.filter-chip.active{background:var(--lav);color:#fff}.ingredient-list{padding:0 24px 24px}.ingredient-row{height:78px;border-radius:23px;margin-bottom:10px;padding:12px 14px;background:rgba(255,255,255,.76);box-shadow:0 12px 26px rgba(62,51,116,.09);display:flex;align-items:center;gap:13px}.ingredient-main{flex:1}.ingredient-title{font-size:15px;font-weight:900;letter-spacing:-.03em}.ingredient-sub{font-size:12px;color:var(--muted);font-weight:700;margin-top:4px}.fresh-badge{height:28px;border-radius:99px;padding:0 10px;display:flex;align-items:center;font-size:11px;font-weight:900;color:#fff;background:var(--green)}.fresh-badge.warn{background:var(--orange)}.fresh-badge.danger{background:var(--red)}

/* Week meal page */
.meal-page{padding-bottom:110px}.meal-day-tabs{display:flex;gap:10px;overflow:auto;padding:8px 24px 18px;scrollbar-width:none}.meal-day{min-width:52px;height:64px;border-radius:22px;background:rgba(255,255,255,.7);box-shadow:0 8px 22px rgba(56,45,105,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:900;color:var(--ink2)}.meal-day.active{background:linear-gradient(135deg,#A98AFF,#7252D4);color:#fff}.section-label{font-size:13px;font-weight:900;letter-spacing:-.03em;margin:14px 24px 10px}.plan-card{margin:0 24px 14px;height:112px;border-radius:26px;background:rgba(255,255,255,.78);box-shadow:0 14px 32px rgba(62,51,116,.1);border:1px solid rgba(255,255,255,.75);display:flex;align-items:center;gap:14px;padding:14px}.tip-card{margin:20px 24px 0;border-radius:28px;padding:18px;background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(241,232,255,.78));border:1px solid rgba(255,255,255,.7);box-shadow:0 14px 35px rgba(93,67,162,.11)}

/* Cart */
.cart-summary{display:flex;gap:8px;padding:8px 24px 18px}.cart-summary .filter-chip{flex:1;justify-content:center;display:flex;align-items:center}.cart-list{padding:0 24px 24px}.cart-section{font-size:13px;font-weight:900;letter-spacing:-.03em;margin:18px 0 10px}.cart-item{height:58px;border-radius:18px;background:rgba(255,255,255,.76);box-shadow:0 8px 20px rgba(62,51,116,.07);display:flex;align-items:center;gap:12px;padding:0 14px;margin-bottom:8px}.check{width:22px;height:22px;border-radius:8px;border:2px solid #C9C4DD;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}.check.done{background:#9A8BC9;border-color:#9A8BC9}.cart-name{flex:1;font-size:14px;font-weight:800}.cart-qty{font-size:12px;color:var(--muted);font-weight:800}

/* Schedule / flow */
.schedule-grid{padding:8px 24px 120px}.schedule-card{border-radius:24px;background:rgba(255,255,255,.75);box-shadow:0 12px 28px rgba(62,51,116,.08);padding:14px;margin-bottom:12px}.slot-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.slot{height:46px;border-radius:16px;background:#fff;color:var(--muted);font-size:12px;font-weight:900;box-shadow:inset 0 0 0 1px rgba(105,84,170,.1)}.slot.on{background:var(--lav3);color:var(--lav);box-shadow:inset 0 0 0 1px rgba(115,84,214,.35)}.bottom-cta{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);width:100%;max-width:430px;padding:0 24px;z-index:40}.style-grid{padding:6px 24px 120px;display:grid;gap:12px}.style-card{height:92px;border-radius:26px;background:rgba(255,255,255,.76);box-shadow:0 12px 28px rgba(62,51,116,.09);padding:16px;display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(255,255,255,.72)}.style-card.sel{background:linear-gradient(135deg,rgba(255,255,255,.86),rgba(238,231,255,.9));box-shadow:0 16px 36px rgba(103,78,210,.16);border-color:rgba(115,84,214,.22)}

/* Recipe */
.recipe-hero{height:250px;position:relative;margin:0 24px 18px;border-radius:32px;background-size:cover;background-position:center;box-shadow:0 22px 50px rgba(60,43,95,.16);overflow:hidden}.recipe-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(23,26,60,.55) 100%)}.recipe-title{position:absolute;left:20px;right:20px;bottom:20px;color:#fff;z-index:2}.recipe-title h1{font-size:27px;line-height:1.12;font-weight:900;letter-spacing:-.045em}.recipe-meta{display:flex;gap:8px;margin-top:10px}.recipe-meta span{height:28px;border-radius:99px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);padding:0 10px;display:flex;align-items:center;font-size:12px;font-weight:900}.recipe-body{padding:0 24px 24px}.table-card{border-radius:24px;overflow:hidden;background:rgba(255,255,255,.78);box-shadow:0 12px 28px rgba(62,51,116,.08);margin-bottom:18px}.row{display:grid;grid-template-columns:1fr 110px;gap:8px;padding:13px 16px;border-bottom:1px solid rgba(105,84,170,.08);font-size:13px}.row:last-child{border-bottom:0}.steps .step{display:flex;gap:12px;margin-bottom:14px}.step-num{width:28px;height:28px;border-radius:50%;background:var(--lav);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0}.step-text{font-size:14px;line-height:1.65;color:var(--ink2);font-weight:600}

/* Modal / loading */
.modal-bg{position:fixed;inset:0;background:rgba(22,20,45,.46);backdrop-filter:blur(14px);z-index:100;display:flex;align-items:flex-end}.modal-card{width:100%;max-width:430px;margin:0 auto;background:rgba(255,255,255,.92);border-radius:34px 34px 0 0;padding:26px 24px 34px;box-shadow:0 -20px 50px rgba(42,35,82,.17)}.load{position:fixed;inset:0;z-index:200;background:rgba(248,245,255,.72);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center}.load-card{width:260px;border-radius:30px;padding:28px;background:rgba(255,255,255,.78);box-shadow:var(--shadow);text-align:center}.spinner{width:46px;height:46px;border-radius:50%;border:4px solid #E4DAFF;border-top-color:var(--lav);margin:0 auto 16px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* Bottom nav */
.tab-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:calc(100% - 32px);max-width:398px;height:76px;border-radius:30px;background:rgba(255,255,255,.74);backdrop-filter:blur(24px);box-shadow:0 18px 48px rgba(63,52,119,.16),inset 0 0 0 1px rgba(255,255,255,.8);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:60}.tab-btn{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8F91AD;font-size:10px;font-weight:800;position:relative}.tab-btn svg{width:21px;height:21px;stroke:currentColor;stroke-width:2}.tab-btn.active{color:var(--lav)}.tab-plus{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#A98AFF,#7252D4);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 14px 24px rgba(103,78,210,.32)}.tab-plus svg{width:24px;height:24px}

@media(min-width:431px){#app{border-radius:0}.bottom-cta{max-width:430px}}
</style>
</head>

<script>

function filterFridge(q){document.querySelectorAll('.ingredient-row').forEach(el=>{el.style.display=el.innerText.includes(q)?'flex':'none'})}
function fridgeModal(){return `<div id="fridge-modal" class="modal-bg hide"><div class="modal-card"><div class="h3">재료 추가</div><div class="field-label">재료명</div><div class="input-wrap"><input id="fi-name" placeholder="예: 아보카도"></div><div class="form-grid"><div><div class="field-label">수량</div><div class="input-wrap"><input id="fi-qty" type="number" placeholder="1"></div></div><div><div class="field-label">단위</div><div class="input-wrap"><select id="fi-unit"><option>개</option><option>g</option><option>ml</option><option>봉지</option></select></div></div></div><div class="field-label">유통기한</div><div class="input-wrap"><input id="fi-expire" type="number" value="7"></div><div style="height:20px"></div><button class="cta" onclick="confirmFridgeAdd()">저장하기</button><button class="secondary" style="width:100%;margin-top:10px" onclick="closeFridgeModal()">취소</button></div></div>`}function openAddFridge(){document.getElementById('fridge-modal').classList.remove('hide')}function closeFridgeModal(){document.getElementById('fridge-modal').classList.add('hide')}function confirmFridgeAdd(){const name=document.getElementById('fi-name').value.trim();if(!name)return;S.fridge.push({name,qty:document.getElementById('fi-qty').value||1,unit:document.getElementById('fi-unit').value,image:foodForName(name),addedAt:new Date().toISOString().slice(0,10),expireDays:parseInt(document.getElementById('fi-expire').value)||7});saveFridge();render('fridge')}
function renderStyle(){const styles=['한식','일식','중식','양식','다이어트','고단백'];return `${shellTop()}<div class="page-head"><button class="back" onclick="go('home')">‹</button><div class="page-title">식단 생성</div><div style="width:42px"></div></div><div class="pad"><div class="h2">어떤 스타일로<br>추천할까요?</div><p class="sub" style="margin-top:8px">선호하는 식단 스타일을 선택하면 AI가 냉장고 재료와 함께 분석해요.</p></div><div class="style-grid">${styles.map(s=>`<button class="style-card ${S.bcStyles.includes(s)?'sel':''}" onclick="toggleStyle('${s}')"><div><div style="font-weight:900;font-size:17px">${s}</div><div class="caption" style="margin-top:5px">맞춤 메뉴 추천</div></div><div class="food-sm" style="background-image:url('${styleImg(s)}')"></div></button>`).join('')}</div><div class="bottom-cta"><button class="cta" ${S.bcStyles.length?'':'disabled'} onclick="generateMeal()">AI 식단 생성하기</button></div>`}function styleImg(s){return s==='양식'?IMG.pasta:s==='다이어트'?IMG.salad:s==='고단백'?IMG.chicken:IMG.bibim}function toggleStyle(s){const i=S.bcStyles.indexOf(s);if(i>=0)S.bcStyles.splice(i,1);else S.bcStyles.push(s);render('style')}
function renderMealPage(){const day=S.mealPlan.weeklyMeal?.[S.currentDay];return `${shellTop()}<div class="page-head"><button class="back" onclick="go('home')">‹</button><div class="page-title">주간 식단</div><button class="ghost-link" onclick="go('style')">생성 기록</button></div><div class="meal-day-tabs">${DAYS.map((d,i)=>`<button class="meal-day ${S.currentDay===i?'active':''}" onclick="S.currentDay=${i};render('meal')"><span>${d}</span><span>${20+i}</span></button>`).join('')}</div><div class="meal-page">${(day?.meals||[]).map((m,i)=>`<div class="section-label">${m.type}</div><button class="plan-card" onclick="S.currentMeal=S.mealPlan.weeklyMeal[S.currentDay].meals[${i}];go('recipe')"><div class="food-sm" style="background-image:url('${m.image||foodForName(m.name)}')"></div><div class="meal-info"><div class="meal-name">${m.name}</div><div class="meal-meta">${m.cookTime||10}분 · ${m.nutrition?.protein||'20g'} 단백질</div></div><div class="arrow">›</div></button>`).join('')||'<div class="pad"><div class="soft-card" style="padding:24px;text-align:center;color:var(--muted);font-weight:800">식단이 비어있어요.</div></div>'}<div class="tip-card"><div style="font-weight:900;color:var(--lav);margin-bottom:6px">AI가 식단을 더 잘 추천할 수 있어요!</div><p class="caption">선호하는 음식, 알러지, 목표를 설정해보세요.</p><button class="ghost-link" style="justify-content:flex-start;margin-top:12px">내 정보 설정하기 ›</button></div></div>`}
function renderCart(){const groups={};S.cart.forEach(i=>{groups[i.cat]=groups[i.cat]||[];groups[i.cat].push(i)});return `${shellTop()}<div class="page-head"><button class="back" onclick="go('home')">‹</button><div class="page-title">장보기 리스트</div><button class="ghost-link">편집</button></div><div class="cart-summary"><button class="filter-chip active">전체 ${S.cart.length}</button><button class="filter-chip">미구매 ${S.cart.filter(i=>!i.done).length}</button><button class="filter-chip">구매완료 ${S.cart.filter(i=>i.done).length}</button></div><div class="cart-list">${Object.keys(groups).map(cat=>`<div class="cart-section">${cat}</div>${groups[cat].map(i=>`<div class="cart-item"><button class="check ${i.done?'done':''}" onclick="toggleCart('${i.name}')">${i.done?'✓':''}</button><div class="cart-name" style="${i.done?'text-decoration:line-through;color:var(--muted)':''}">${i.name}</div><div class="cart-qty">${i.qty}</div></div>`).join('')}`).join('')}</div><div class="bottom-cta"><button class="cta">공유하기</button></div>`}function toggleCart(n){const i=S.cart.find(x=>x.name===n);if(i)i.done=!i.done;saveCart();render('cart')}
function renderRecipe(){const m=S.currentMeal||S.mealPlan.weeklyMeal?.[S.currentDay]?.meals?.[0]||SAMPLE_MEAL.weeklyMeal[0].meals[0];return `${shellTop()}<div class="page-head"><button class="back" onclick="go('meal')">‹</button><div class="page-title">레시피</div><div style="width:42px"></div></div><div class="recipe-hero" style="background-image:url('${m.image||foodForName(m.name)}')"><div class="recipe-title"><h1>${m.name}</h1><div class="recipe-meta"><span>${m.cookTime||15}분</span><span>${S.people}인분</span><span>${m.nutrition?.protein||'20g'} 단백질</span></div></div></div><div class="recipe-body">${m.recipe?renderRecipeDetail(m.recipe):`<button class="cta" onclick="fetchRecipe()">레시피 불러오기</button>`}</div>`}
function renderRecipeDetail(r){return `<div class="section-title">Ingredients</div><div class="table-card">${(r.ingredients||[]).map(x=>`<div class="row"><b>${typeof x==='string'?x:x.name}</b><span>${typeof x==='string'?'적당량':x.amount}</span></div>`).join('')}</div><div class="section-title">Step by Step</div><div class="steps">${(r.steps||[]).map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div><div class="step-text">${s}</div></div>`).join('')}</div>`}
async function fetchRecipe(){const m=S.currentMeal||SAMPLE_MEAL.weeklyMeal[0].meals[0];showLoading('레시피를 불러오는 중...');try{const r=await callGemini(`한국어만. ${m.name} ${S.people}인분 레시피를 JSON만 반환: {"ingredients":[{"name":"재료","amount":"100g"}],"steps":["단계"]}`);m.recipe=r}catch(e){m.recipe={ingredients:(m.mainIngredients||['재료']).map(x=>({name:x,amount:'적당량'})),steps:['재료를 손질합니다.','팬을 예열하고 재료를 넣어 조리합니다.','간을 맞춘 뒤 그릇에 담아 완성합니다.']}}hideLoading();render('recipe')}
async function generateMeal(){if(!S.apiKey){go('api');return}showLoading('AI가 식단을 설계하는 중...');const ing=S.fridge.map(x=>`${x.name} ${x.qty}${x.unit}`).join(', ');const schedule=DAYS.map(d=>`${d}:${(S.schedule[d]||[]).join('/')}`).join(', ');try{const prompt=`한국어만. 전문 영양사. ${S.people}인 기준 일주일 식단 JSON만. 스타일:${S.bcStyles.join(',')}. 냉장고:${ing}. 스케줄:${schedule}. 형식 {"weeklyMeal":[{"day":"월","meals":[{"type":"아침","name":"메뉴","mainIngredients":["재료"],"cookTime":10,"nutrition":{"protein":"20g","carb":"40g","veggie":"충분"},"sides":[]}]}],"tip":"팁","needMoreIngredients":false}`;const r=await callGemini(prompt);if(r.weeklyMeal){r.weeklyMeal.forEach(d=>d.meals?.forEach(m=>m.image=foodForName(m.name)));S.mealPlan=r;saveMeal()}}catch(e){alert('Gemini 호출 실패. 샘플 식단으로 이동합니다. '+e.message)}hideLoading();go('meal')}
async function callGemini(prompt){const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(S.apiKey)}`;const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:.7,responseMimeType:'application/json'}})});if(!res.ok)throw new Error('API 오류 '+res.status);const data=await res.json();let text=data.candidates?.[0]?.content?.parts?.[0]?.text||'';text=text.replace(/```json|```/g,'').trim();return JSON.parse(text)}
function showLoading(t){document.body.insertAdjacentHTML('beforeend',`<div id="loading" class="load"><div class="load-card"><div class="spinner"></div><div style="font-weight:900">${t}</div><div class="caption" style="margin-top:8px">잠시만 기다려주세요</div></div></div>`)}function hideLoading(){document.getElementById('loading')?.remove()}
render('splash');
</script>
</body>
</html>
